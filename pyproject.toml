[project]
name = "ecobox"
version = "0.1.0"
description = "Local webcam waste-entry detection for a smart bin (no ML)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.17.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.2",
]

[project.scripts]
ecobox = "src.main:main"
ecobox-calibrate = "src.calibrate:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
